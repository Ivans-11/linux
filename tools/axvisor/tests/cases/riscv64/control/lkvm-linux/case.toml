arch = "riscv64"
mode = "control"
case = "riscv64-control-lkvm-linux"
host_profile = "riscv64-qemu"
status = "active"
host_cmdline = "console=ttyS0 earlycon=sbi panic=-1 init=/init"

guest_image = "qemu-riscv64-linux"
payload_files = ["qemu-riscv64", "initramfs.cpio.gz", "rootfs.img"]
payload_assets = []
initramfs_init = "tests/programs/host_shell_init.sh"
host_initramfs_assets = ["host-initramfs-riscv64"]
test_files = []
guest_initramfs_files = [{ source = "guest/lkvm-network.sh", target = "/test/lkvm-network.sh" }]
timeout_secs = 600
success_regex = ["(?m)^guest test pass!\\s*$"]
fail_regex = [
  "(?i)kernel panic", "(?i)panicked at", "(?i)login incorrect",
  "(?i)permission denied",
]
shell_prompt = "~ # "
extra_qemu_args = [
  "-drive",
  "if=none,format=raw,id=lkvm_linux_payload,file={control_payload_image}",
  "-device",
  "virtio-blk-device,drive=lkvm_linux_payload",
]

[[interactions]]
expect = "~ # "
send = "(while ! ip link show tap0 >/dev/null 2>&1; do sleep 1; done; ip link set tap0 up; ip addr replace 172.16.0.1/24 dev tap0; mkdir -p /tmp/l; echo lkvm-network-pass > /tmp/l/probe; httpd -f -p 172.16.0.1:8080 -h /tmp/l & (sleep 5; while true; do echo virtio-udp-pass | nc -u -s 172.16.0.1 -w 1 172.16.0.2 9000; sleep 1; done)) & umount /ext2 2>/dev/null; mount -t ext2 /dev/vda /ext2"

[[interactions]]
expect = "~ # "
send = "/test/lkvm run --dev /dev/kvm --nodefaults --console serial --tty 1 --tty 2 --tty 3 --virtio-transport mmio --network mode=tap,tapif=tap0 --disable-ssaia -c 4 -m 256M -k /ext2/qemu-riscv64 -i /ext2/initramfs.cpio.gz -d /ext2/rootfs.img -p 'earlycon=sbi console=ttyS0,115200 init=/init root=/dev/vda rw'"

[[interactions]]
expect = "~ # "
send = "/test/lkvm-network.sh"
