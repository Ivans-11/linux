arch = "riscv64"
mode = "control"
case = "riscv64-control-smoke"
host_profile = "riscv64-qemu"
status = "active"
host_cmdline = "console=ttyS0 earlycon=sbi panic=-1 init=/init"

test_files = [{ source = "tests/programs/kvm_smoke.c", target = "test/kvm_smoke" }]
payload_files = []
payload_assets = []
initramfs_init = "tests/programs/host_shell_init.sh"
host_initramfs_assets = ["host-initramfs-riscv64"]
timeout_secs = 120
success_regex = ["(?m)^kvm smoke pass\\s*$"]
fail_regex = ["(?i)kernel panic", "(?i)panicked at", "(?i)KVM_.*failed"]
shell_prompt = "~ # "
shell_init_cmd = "/test/kvm_smoke"
