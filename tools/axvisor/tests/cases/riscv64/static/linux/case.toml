arch = "riscv64"
mode = "static"
case = "riscv64-static-linux"
host_profile = "riscv64-qemu"
status = "active"

# Static Linux guest startup and network probe.
guest = "linux"
guest_image = "qemu-riscv64-linux"
vm_config = "vm.toml"
payload_files = ["qemu-riscv64", "rootfs.img"]
payload_assets = []
test_files = []
timeout_secs = 180
success_regex = ["(?m)^guest test pass!\\s*$"]
fail_regex = [
  "(?i)kernel panic",
  "(?i)panicked at",
  "(?i)login incorrect",
  "(?i)permission denied",
]
shell_prompt = "~ # "
shell_init_cmd = "/bin/busybox mount -t proc proc /proc 2>/dev/null || true; n=$(/bin/busybox grep -c '^processor' /proc/cpuinfo); /bin/busybox ip link set eth0 up && /bin/busybox ip addr add 10.0.2.15/24 dev eth0 && /bin/busybox ping -c 3 -W 3 10.0.2.2 && test \"$n\" -ge 4 && echo 'guest test pass!'"

# These are guest-device arguments, not outer host-QEMU arguments.
extra_qemu_args = [
  "-drive", "if=none,format=raw,id=axvisor_guest_rootfs,file={guest_dir}/rootfs.img",
  "-device", "virtio-blk-device,drive=axvisor_guest_rootfs",
  "-netdev", "user,id=axvisor_guest_net",
  "-device", "virtio-net-device,netdev=axvisor_guest_net,mac=06:00:ac:10:00:02",
]
