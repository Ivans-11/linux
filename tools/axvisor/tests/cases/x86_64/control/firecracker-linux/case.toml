arch = "x86_64"
mode = "control"
case = "x86_64-control-firecracker-linux"
host_profile = "x86_64-qemu"
status = "active"

guest_image = "qemu-x86_64-linux"
payload_files = ["initramfs.cpio.gz", "rootfs.img", "firecracker-vmlinux", "firecracker-x86_64.json"]
payload_assets = ["firecracker-vmlinux-x86_64"]
initramfs_init = "tests/programs/host_shell_init.sh"
host_initramfs_assets = ["host-initramfs-x86_64"]
test_files = []
timeout_secs = 600
success_regex = ["(?m)^firecracker guest test pass!\\s*$"]
fail_regex = [
  "(?i)uncaught panic", "(?i)panicked at", "(?i)kernel panic",
  "(?i)login incorrect", "(?i)permission denied", "(?i)Firecracker exiting with error",
  "(?i)RunWithApiError", "(?i)StartMicrovm", "(?im)^KVM_[A-Z0-9_]+ failed(?:\\s|:)",
  "(?i)firecracker payload mount failed",
]
shell_prompt = "~ # "
extra_qemu_args = [
  "-drive",
  "if=none,format=raw,id=firecracker_linux_payload,file={control_payload_image}",
  "-device",
  "virtio-blk-pci,bus=pcie.0,addr=0x6,drive=firecracker_linux_payload,serial=vaxvisorfc,disable-legacy=on,disable-modern=off,queue-size=64,num-queues=1,request-merging=off,backend_defaults=off,discard=off,write-zeroes=off,event_idx=off,indirect_desc=off,queue_reset=off",
]

[[interactions]]
expect = "~ # "
send = "(while ! /bin/busybox ip link show tap0 >/dev/null 2>&1; do /bin/busybox sleep 1; done; /bin/busybox ip link set tap0 up; /bin/busybox ip addr replace 172.16.0.1/24 dev tap0; mkdir -p /tmp/firecracker-net; echo firecracker-network-pass > /tmp/firecracker-net/probe; /bin/busybox httpd -f -p 172.16.0.1:8080 -h /tmp/firecracker-net) & umount /ext2 2>/dev/null; (mount -t ext2 /dev/vda /ext2 || { echo firecracker 'payload mount failed'; ls /dev; false; }) && /test/firecracker --api-sock /tmp/firecracker.socket --no-seccomp --config-file /ext2/firecracker-x86_64.json --level Info"

[[interactions]]
expect = "~ # "
send = "/bin/busybox mount -t proc proc /proc 2>/dev/null || true; n=$(/bin/busybox grep -c '^processor' /proc/cpuinfo); /bin/busybox mkdir -p /tmp && /bin/busybox ip link set eth0 up && /bin/busybox ip addr add 172.16.0.2/24 dev eth0 && /bin/busybox wget -T 10 -q -O /tmp/network-probe http://172.16.0.1:8080/probe && /bin/busybox grep -q '^firecracker-network-pass$' /tmp/network-probe && test \"$n\" -ge 4 && echo 'firecracker guest test pass!'"
